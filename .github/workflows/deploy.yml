name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the repo's own wrangler (v4, installed by npm ci) instead of
      # cloudflare/wrangler-action: the action bundles wrangler 3.x, which
      # can't read wrangler.jsonc and dies with "Missing entry-point".
      # This is the exact command that works locally (npm run deploy).
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d4df51783b85b94b0a9815cc51069ceb
